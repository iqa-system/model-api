openapi: 3.1.0
info:
  title: IQA Model API
  version: "2.0"
  description: |
    图像质量评估模型服务。
    支持模型发现、单图推理、多图批量推理，并允许调用方通过 model_id 选择模型。
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /health:
    get:
      summary: 健康检查
      tags:
        - system
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  model_loaded:
                    type: boolean
                  default_model_id:
                    type: string
                    nullable: true
                  loaded_models:
                    type: array
                    items:
                      type: string
  /models:
    get:
      summary: 获取可用模型列表
      tags:
        - models
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsResponse"
              examples:
                success:
                  value:
                    default_model_id: "liqe_default"
                    models:
                      - model_id: "liqe_default"
                        display_name: "LIQE Default"
                        description: "当前系统默认使用的 LIQE 权重。"
                        capabilities:
                          - "quality_score"
                          - "scene"
                          - "distortion"
                          - "distortions"
                        is_default: true
  /predict:
    post:
      summary: 单张图片推理
      tags:
        - inference
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                model_id:
                  type: string
                  description: 可选模型 ID，未传时使用默认模型
            encoding:
              file:
                contentType: image/*
      responses:
        "200":
          description: 推理成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictResult"
              examples:
                success:
                  value:
                    file_name: "toothless.jpg"
                    model_id: "liqe_default"
                    quality_score: 54.321
                    extra_outputs: {}
                    scene: 4
                    distortion: 3
                    distortions:
                      - index: 3
                        prob: 0.4213
        "400":
          description: 请求无效、模型不存在或图片读取失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              examples:
                invalid_model:
                  value:
                    detail: "未知模型: unknown-model。当前可用模型: liqe_default, liqe_mix, liqe_koniq"
  /predict/batch:
    post:
      summary: 多张图片批量推理
      tags:
        - inference
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                model_id:
                  type: string
                  description: 可选模型 ID，未传时使用默认模型
            encoding:
              files:
                contentType: image/*
      responses:
        "200":
          description: 推理成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchPredictResponse"
              examples:
                success:
                  value:
                    results:
                      - file_name: "a.jpg"
                        model_id: "liqe_mix"
                        quality_score: 61.0
                        extra_outputs: {}
                        scene: 3
                        distortion: 2
                        distortions:
                          - index: 2
                            prob: 0.6124
                      - file_name: "b.jpg"
                        model_id: "liqe_mix"
                        quality_score: 47.8
                        extra_outputs: {}
                        scene: 4
                        distortion: 3
                        distortions:
                          - index: 3
                            prob: 0.512
        "400":
          description: 请求无效、模型不存在或图片读取失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
components:
  schemas:
    DistortionProb:
      type: object
      required:
        - index
        - prob
      properties:
        index:
          type: integer
          description: 失真类型编码
        prob:
          type: number
          description: 失真概率
    PredictResult:
      type: object
      required:
        - model_id
        - quality_score
        - extra_outputs
      properties:
        file_name:
          type: string
          nullable: true
        model_id:
          type: string
          description: 实际执行推理的模型 ID
        quality_score:
          type: number
          format: float
        extra_outputs:
          type: object
          additionalProperties: true
          description: 模型的通用扩展输出
        scene:
          type: integer
          nullable: true
          description: 场景类别编码，仅支持该能力的模型返回
        distortion:
          type: integer
          nullable: true
          description: 兼容字段，仅支持该能力的模型返回
        distortions:
          type: array
          nullable: true
          description: 失真概率列表，仅支持该能力的模型返回
          items:
            $ref: "#/components/schemas/DistortionProb"
    BatchPredictResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PredictResult"
    ModelInfo:
      type: object
      required:
        - model_id
        - display_name
        - description
        - capabilities
        - is_default
      properties:
        model_id:
          type: string
        display_name:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
        is_default:
          type: boolean
    ModelsResponse:
      type: object
      required:
        - default_model_id
        - models
      properties:
        default_model_id:
          type: string
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"
    HTTPError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
